<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxia de Flores Amarillas 🌻</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #020108;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      width: 100vw;
    }

    #galaxy-canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .ui {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 90%;
      max-width: 420px;
    }

    .mensaje {
      color: #fff59d;
      font-size: 17px;
      text-align: center;
      text-shadow: 0 0 12px rgba(255, 202, 40, 0.55);
      line-height: 1.4;
      opacity: 0.95;
    }

    .btn-audio {
      background: rgba(255, 202, 40, 0.12);
      border: 1px solid #ffca28;
      color: #ffca28;
      padding: 11px 26px;
      border-radius: 50px;
      font-size: 15px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.25s ease;
      box-shadow: 0 0 18px rgba(255, 202, 40, 0.18);
    }

    .btn-audio:hover {
      background: rgba(255, 202, 40, 0.25);
      transform: scale(1.04);
    }
  </style>
</head>
<body>

  <canvas id="galaxy-canvas"></canvas>

  <div class="ui">
    <p class="mensaje">Para todas las chicas que no han recibido sus flores amarillas 🌻</p>
    <button class="btn-audio" onclick="toggleAudio()">🎵 Activar Sonido</button>
  </div>

  <!-- Aquí puedes poner tu canción después -->
  <audio id="bg-song" loop>
    <!-- <source src="tu-musica.mp3" type="audio/mpeg"> -->
  </audio>

  <script>
    const canvas = document.getElementById('galaxy-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let particles = [];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Partículas doradas (polvo estelar)
    class SpaceDust {
      constructor() {
        this.reset();
        this.y = Math.random() * height;
      }
      reset() {
        this.x = Math.random() * width;
        this.y = height + 20;
        this.size = Math.random() * 2 + 0.5;
        this.speedY = Math.random() * 0.6 + 0.15;
        this.speedX = Math.sin(Math.random() * Math.PI) * 0.2;
        this.alpha = Math.random() * 0.5 + 0.2;
      }
      update() {
        this.y -= this.speedY;
        this.x += this.speedX;
        if (this.y < -20) this.reset();
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = '#ffca28';
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#ffca28';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < 100; i++) {
      particles.push(new SpaceDust());
    }

    // Flor elegante con pétalos en degradado
    function drawElegantFlower(centerX, centerY, size, rotationOffset) {
      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.rotate(rotationOffset);

      const petals = 14;
      for (let i = 0; i < petals; i++) {
        ctx.rotate((Math.PI * 2) / petals);

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-size / 2, -size / 2, -size / 2.5, -size, 0, -size);
        ctx.bezierCurveTo(size / 2.5, -size, size / 2, -size / 2, 0, 0);

        let petalGrad = ctx.createLinearGradient(0, 0, 0, -size);
        petalGrad.addColorStop(0, '#e65100');
        petalGrad.addColorStop(0.4, '#ffb300');
        petalGrad.addColorStop(1, '#fff59d');

        ctx.fillStyle = petalGrad;
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ffb300';
        ctx.fill();
      }

      // Centro de la flor
      ctx.beginPath();
      ctx.arc(0, 0, size / 3.8, 0, Math.PI * 2);
      let centerGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, size / 3.8);
      centerGrad.addColorStop(0, '#2e1c16');
      centerGrad.addColorStop(0.7, '#4e342e');
      centerGrad.addColorStop(1, '#1a0c08');
      ctx.fillStyle = centerGrad;
      ctx.fill();

      ctx.restore();
    }

    let globalRotation = 0;

    function render() {
      // Efecto de estela suave
      ctx.fillStyle = 'rgba(2, 1, 8, 0.08)';
      ctx.fillRect(0, 0, width, height);

      particles.forEach(p => {
        p.update();
        p.draw();
      });

      const cx = width / 2;
      const cy = height * 0.7;

      globalRotation += 0.003;

      // Tallos
      ctx.save();
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = '#1b5e20';
      ctx.shadowBlur = 8;
      ctx.shadowColor = '#4caf50';

      // Izquierdo
      ctx.beginPath();
      ctx.moveTo(cx, height);
      ctx.quadraticCurveTo(cx - 100, cy + 120, cx - 110, cy + 50);
      ctx.stroke();

      // Derecho
      ctx.beginPath();
      ctx.moveTo(cx, height);
      ctx.quadraticCurveTo(cx + 100, cy + 120, cx + 110, cy + 50);
      ctx.stroke();

      // Central
      ctx.beginPath();
      ctx.moveTo(cx, height);
      ctx.quadraticCurveTo(cx, cy + 90, cx, cy - 50);
      ctx.stroke();
      ctx.restore();

      // Flores
      drawElegantFlower(cx - 110, cy + 50, 45, -globalRotation);
      drawElegantFlower(cx + 110, cy + 50, 45, globalRotation);
      drawElegantFlower(cx, cy - 50, 60, globalRotation * 0.5);

      requestAnimationFrame(render);
    }

    function toggleAudio() {
      const song = document.getElementById('bg-song');
      const btn = document.querySelector('.btn-audio');

      if (song.paused) {
        song.play().catch(() => console.log("Se necesita interacción del usuario"));
        btn.innerText = "⏸️ Pausar Sonido";
      } else {
        song.pause();
        btn.innerText = "🎵 Activar Sonido";
      }
    }

    render();
  </script>
</body>
</html>
