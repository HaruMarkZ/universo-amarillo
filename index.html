<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flores Amarillas para Blanca 🌻</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at center, #2d0a1f 0%, #1a0512 70%, #0d0209 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      position: relative;
    }
    .heart-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .heart-bg span {
      position: absolute;
      color: #ff4d6d;
      opacity: 0.22;
      animation: floatHeart 11s linear infinite;
    }
    @keyframes floatHeart {
      0%   { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      15%  { opacity: 0.25; }
      85%  { opacity: 0.18; }
      100% { transform: translateY(-20px) rotate(360deg); opacity: 0; }
    }
    .card {
      position: relative;
      width: 90%;
      max-width: 340px;
      background: linear-gradient(160deg, #4a2108, #3a1a06);
      border-radius: 22px;
      padding: 28px 22px 26px;
      text-align: center;
      border: 3px solid #ffd54f;
      box-shadow: 
        0 0 25px rgba(255, 193, 7, 0.35),
        0 15px 40px rgba(0,0,0,0.45);
      z-index: 2;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 70%;
      height: 18px;
      background: radial-gradient(ellipse, rgba(255, 213, 79, 0.55), transparent 70%);
      border-radius: 0 0 50% 50%;
    }
    .title {
      color: #fff8e1;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 2px;
      text-shadow: 0 0 10px rgba(255, 213, 79, 0.6);
    }
    .subtitle {
      color: #ffecb3;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .bunny-circle {
      width: 160px;
      height: 160px;
      margin: 0 auto 18px;
      background: #fff8e1;
      border-radius: 50%;
      border: 4px solid #ffd54f;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 18px rgba(255, 193, 7, 0.4);
      overflow: hidden;
    }
    .bunny-img {
      width: 135px;
      height: 135px;
      object-fit: contain;
    }
    .message {
      color: #ffe082;
      font-size: 14.5px;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .btn {
      background: linear-gradient(135deg, #ffca28, #ffb300);
      color: #3e2723;
      font-weight: 700;
      font-size: 15px;
      padding: 12px 30px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      box-shadow: 0 5px 18px rgba(255, 179, 0, 0.4);
      transition: all 0.25s ease;
    }
    .btn:hover {
      transform: scale(1.05);
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 50;
      padding: 20px;
    }
    .overlay.active {
      display: flex;
    }
    .letter {
      background: linear-gradient(160deg, #fff8e1, #ffecb3);
      border-radius: 18px;
      padding: 26px 22px;
      max-width: 300px;
      width: 100%;
      text-align: center;
      box-shadow: 0 18px 45px rgba(0,0,0,0.4);
    }
    .letter h2 {
      color: #e65100;
      font-size: 20px;
      margin-bottom: 12px;
    }
    .letter p {
      color: #5d4037;
      font-size: 15px;
      line-height: 1.55;
      margin-bottom: 18px;
    }
    .close-btn {
      background: #ff8f00;
      color: white;
      border: none;
      padding: 9px 22px;
      border-radius: 50px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Audio de Floricienta -->
  <audio id="audio-player" src="img_Floricienta.mp3" preload="auto" loop></audio>

  <div class="heart-bg" id="hearts"></div>

  <div class="card">
    <div class="title">Flores Amarillas</div>
    <div class="subtitle">para ti, Blanca 🌻</div>

    <div class="bunny-circle">
      <img src="https://i.pinimg.com/736x/08/52/b4/0852b46592014cb5dab875138bc60da0.jpg" 
           alt="Gato con flores" 
           class="bunny-img">
    </div>

    <div class="message">
      Este detalle es para tí,<br>
      no pude evitar pensar en ti…
    </div>

    <button class="btn" onclick="mostrarCarta()">CLICK AQUÍ →</button>
  </div>

  <div class="overlay" id="overlay">
    <div class="letter">
      <h2>Para Blanca 💛</h2>
      <p>
        Solo quería enviarte estas flores.<br><br>
        Espero que te guste.
      </p>
      <button class="close-btn" onclick="cerrarCarta()">Cerrar</button>
    </div>
  </div>

  <script>
    // Corazones flotantes
    const container = document.getElementById('hearts');
    for (let i = 0; i < 16; i++) {
      const h = document.createElement('span');
      h.innerHTML = '♥';
      h.style.left = Math.random() * 100 + '%';
      h.style.fontSize = (13 + Math.random() * 14) + 'px';
      h.style.animationDuration = (7 + Math.random() * 9) + 's';
      h.style.animationDelay = Math.random() * 7 + 's';
      container.appendChild(h);
    }

    // Reproducir música
    const audio = document.getElementById('audio-player');
    audio.volume = 0.6; // volumen al 60%

    // Intenta reproducir automáticamente
    audio.play().catch(() => {
      // Si el navegador bloquea el autoplay, se reproduce al primer clic
      document.body.addEventListener('click', () => {
        if (audio.paused) {
          audio.play().catch(() => {});
        }
      }, { once: true });
    });

    function mostrarCarta() {
      document.getElementById('overlay').classList.add('active');
      // Asegura que suene al abrir la carta
      if (audio.paused) {
        audio.play().catch(() => {});
      }
    }

    function cerrarCarta() {
      document.getElementById('overlay').classList.remove('active');
    }
  </script>
</body>
</html>
