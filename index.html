<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxia de Flores Amarillas 🌻</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #020108;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      width: 100vw;
    }

    #galaxy-canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .ui {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 90%;
      max-width: 420px;
      pointer-events: none;
    }

    .mensaje {
      color: #fff59d;
      font-size: 16px;
      text-align: center;
      text-shadow: 0 0 12px rgba(255, 202, 40, 0.55);
      line-height: 1.45;
      opacity: 0.95;
    }

    .btn-audio {
      pointer-events: auto;
      background: rgba(255, 202, 40, 0.1);
      border: 1px solid #ffca28;
      color: #ffca28;
      padding: 11px 26px;
      border-radius: 50px;
      font-size: 15px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.25s ease;
      box-shadow: 0 0 18px rgba(255, 202, 40, 0.25);
    }

    .btn-audio:hover {
      background: rgba(255, 202, 40, 0.22);
      transform: scale(1.04);
    }
  </style>
</head>
<body>

  <canvas id="galaxy-canvas"></canvas>

  <div class="ui">
    <p class="mensaje">Para todas las chicas que no han recibido sus flores amarillas 🌻</p>
    <button class="btn-audio" onclick="toggleAudio()">🎵 Activar Sonido</button>
  </div>

  <audio id="bg-song" loop>
    <!-- Aquí pondrás tu canción después -->
  </audio>

  <script>
    const canvas = document.getElementById('galaxy-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let particles = [];
    let flowers = [];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Función para generar puntos de un corazón
    function heartPoint(t, scale = 1) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return { x: x * scale, y: y * scale };
    }

    // Partícula de la galaxia / corazón
    class Particle {
      constructor(isHeart = false) {
        this.isHeart = isHeart;
        this.reset();
      }

      reset() {
        if (this.isHeart) {
          const t = Math.random() * Math.PI * 2;
          const point = heartPoint(t, 9 + Math.random() * 3);
          this.baseX = width / 2 + point.x * 4.2;
          this.baseY = height / 2 + point.y * 4.2 - 40;
          this.x = this.baseX + (Math.random() - 0.5) * 40;
          this.y = this.baseY + (Math.random() - 0.5) * 40;
          this.size = Math.random() * 2.2 + 0.8;
          this.alpha = Math.random() * 0.7 + 0.3;
        } else {
          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.size = Math.random() * 1.8 + 0.4;
          this.alpha = Math.random() * 0.5 + 0.15;
          this.speedX = (Math.random() - 0.5) * 0.3;
          this.speedY = (Math.random() - 0.5) * 0.3;
        }
        this.twinkle = Math.random() * Math.PI * 2;
      }

      update() {
        this.twinkle += 0.04;
        if (!this.isHeart) {
          this.x += this.speedX;
          this.y += this.speedY;
          if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
            this.reset();
          }
        } else {
          // ligera vibración
          this.x = this.baseX + Math.sin(this.twinkle) * 2.5;
          this.y = this.baseY + Math.cos(this.twinkle * 0.8) * 2.5;
        }
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha * (0.6 + 0.4 * Math.sin(this.twinkle));
        ctx.fillStyle = '#ffca28';
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#ffb300';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // Flor simple flotante
    class Flower {
      constructor() {
        this.reset(true);
      }

      reset(first = false) {
        this.x = Math.random() * width;
        this.y = first ? Math.random() * height : height + 40;
        this.size = Math.random() * 18 + 14;
        this.speedY = Math.random() * 0.35 + 0.15;
        this.speedX = (Math.random() - 0.5) * 0.4;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.02;
        this.alpha = Math.random() * 0.5 + 0.35;
      }

      update() {
        this.y -= this.speedY;
        this.x += this.speedX;
        this.rotation += this.rotSpeed;
        if (this.y < -50) this.reset();
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.globalAlpha = this.alpha;

        // pétalos
        for (let i = 0; i < 8; i++) {
          ctx.rotate(Math.PI / 4);
          const grad = ctx.createLinearGradient(0, 0, 0, -this.size);
          grad.addColorStop(0, '#e65100');
          grad.addColorStop(0.5, '#ffb300');
          grad.addColorStop(1, '#fff59d');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.ellipse(0, -this.size * 0.55, this.size * 0.28, this.size * 0.55, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        // centro
        ctx.beginPath();
        ctx.arc(0, 0, this.size * 0.28, 0, Math.PI * 2);
        ctx.fillStyle = '#3e2723';
        ctx.fill();

        ctx.restore();
      }
    }

    // Crear partículas del corazón
    for (let i = 0; i < 900; i++) {
      particles.push(new Particle(true));
    }

    // Partículas de fondo
    for (let i = 0; i < 180; i++) {
      particles.push(new Particle(false));
    }

    // Flores flotantes
    for (let i = 0; i < 12; i++) {
      flowers.push(new Flower());
    }

    function render() {
      // estela suave
      ctx.fillStyle = 'rgba(2, 1, 8, 0.12)';
      ctx.fillRect(0, 0, width, height);

      particles.forEach(p => {
        p.update();
        p.draw();
      });

      flowers.forEach(f => {
        f.update();
        f.draw();
      });

      requestAnimationFrame(render);
    }

    function toggleAudio() {
      const song = document.getElementById('bg-song');
      const btn = document.querySelector('.btn-audio');

      if (song.paused) {
        song.play().catch(() => {});
        btn.innerText = "⏸️ Pausar Sonido";
      } else {
        song.pause();
        btn.innerText = "🎵 Activar Sonido";
      }
    }

    render();
  </script>
</body>
</html>
