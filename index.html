<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universo Floral 🌌🌻</title>
    <!-- Jalamos el CSS desde su nueva carpeta -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Contenedor del Espacio Profundo y Nebulosas -->
    <div class="space-container">
        <div class="nebula purple-nebula"></div>
        <div class="nebula gold-nebula"></div>
    </div>

    <!-- Contenedor de la Interfaz Estilizada -->
    <div class="interface-wrapper">
        <div class="glass-card">
            <h1 class="cosmic-title">Universo Amarillo</h1>
            <p class="cosmic-subtitle">Un detalle especial creado en el espacio profundo</p>
        </div>
        
        <!-- Lienzo interactivo para las flores y el polvo cósmico -->
        <canvas id="galaxy-canvas"></canvas>

        <!-- Controlador de Audio Organizado -->
        <div class="music-controller">
            <!-- La música apuntará a la carpeta music/ cuando subas tu canción -->
            <audio id="bg-song" loop src="music/tu-cancion.mp3"></audio>
            <button class="btn-audio" onclick="toggleAudio()">🎵 Activar Sonido</button>
        </div>
    </div>

    <!-- Jalamos la lógica JS desde su nueva carpeta -->
    <script src="js/main.js"></script>
</body>
</html>
