<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxia de Flores Amarillas 🌻</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      width: 100vw;
    }

    #galaxy-canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .ui {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 90%;
      max-width: 420px;
      pointer-events: none;
    }

    .mensaje {
      color: #ffe082;
      font-size: 16px;
      text-align: center;
      text-shadow: 0 0 10px rgba(255, 193, 7, 0.5);
      line-height: 1.45;
      opacity: 0.95;
    }

    .btn-audio {
      pointer-events: auto;
      background: rgba(0, 0, 0, 0.45);
      border: 1.5px solid #ffca28;
      color: #ffca28;
      padding: 10px 24px;
      border-radius: 50px;
      font-size: 15px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: all 0.25s ease;
      box-shadow: 0 0 15px rgba(255, 202, 40, 0.25);
    }

    .btn-audio:hover {
      background: rgba(255, 202, 40, 0.15);
      transform: scale(1.04);
    }
  </style>
</head>
<body>

  <canvas id="galaxy-canvas"></canvas>

  <div class="ui">
    <p class="mensaje">Para todas las chicas que no han recibido sus flores<br>amarillas 🌻</p>
    <button class="btn-audio" onclick="toggleAudio()">♪ Activar Sonido</button>
  </div>

  <audio id="bg-song" loop>
    <!-- Aquí pondrás tu canción después -->
  </audio>

  <script>
    const canvas = document.getElementById('galaxy-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let particles = [];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Partículas alargadas (rayitos dorados)
    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * width;
        this.y = height + Math.random() * 100;
        this.length = Math.random() * 18 + 8;
        this.speed = Math.random() * 1.8 + 0.8;
        this.alpha = Math.random() * 0.6 + 0.3;
        this.size = Math.random() * 1.8 + 0.6;
      }
      update() {
        this.y -= this.speed;
        if (this.y < -this.length) this.reset();
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.strokeStyle = '#ffca28';
        ctx.lineWidth = this.size;
        ctx.lineCap = 'round';
        ctx.shadowBlur = 6;
        ctx.shadowColor = '#ffca28';
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x, this.y + this.length);
        ctx.stroke();
        ctx.restore();
      }
    }

    for (let i = 0; i < 120; i++) {
      particles.push(new Particle());
    }

    // Flor redonda suave (estilo de la imagen)
    function drawSoftFlower(x, y, size) {
      ctx.save();
      ctx.translate(x, y);

      // Brillo exterior
      const glow = ctx.createRadialGradient(0, 0, size * 0.3, 0, 0, size * 1.3);
      glow.addColorStop(0, 'rgba(255, 236, 100, 0.45)');
      glow.addColorStop(1, 'rgba(255, 200, 0, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 0, size * 1.3, 0, Math.PI * 2);
      ctx.fill();

      // Pétalos (capa externa)
      const petals = 16;
      for (let i = 0; i < petals; i++) {
        const angle = (i / petals) * Math.PI * 2;
        ctx.save();
        ctx.rotate(angle);

        const petalGrad = ctx.createLinearGradient(0, 0, 0, -size);
        petalGrad.addColorStop(0, '#ff8f00');
        petalGrad.addColorStop(0.4, '#ffca28');
        petalGrad.addColorStop(1, '#fff59d');

        ctx.fillStyle = petalGrad;
        ctx.beginPath();
        ctx.ellipse(0, -size * 0.55, size * 0.28, size * 0.55, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Centro oscuro
      const centerGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 0.32);
      centerGrad.addColorStop(0, '#3e2723');
      centerGrad.addColorStop(0.7, '#5d4037');
      centerGrad.addColorStop(1, '#2c1a12');
      ctx.fillStyle = centerGrad;
      ctx.beginPath();
      ctx.arc(0, 0, size * 0.32, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function render() {
      // Fondo negro con leve estela
      ctx.fillStyle = 'rgba(0, 0, 0, 0.18)';
      ctx.fillRect(0, 0, width, height);

      // Partículas
      particles.forEach(p => {
        p.update();
        p.draw();
      });

      const cx = width / 2;
      const cy = height * 0.68;

      // Tallos
      ctx.save();
      ctx.strokeStyle = '#2e7d32';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.shadowBlur = 6;
      ctx.shadowColor = '#4caf50';

      // Tallo central
      ctx.beginPath();
      ctx.moveTo(cx, height);
      ctx.quadraticCurveTo(cx, cy + 80, cx, cy - 10);
      ctx.stroke();

      // Tallo izquierdo
      ctx.beginPath();
      ctx.moveTo(cx, height);
      ctx.quadraticCurveTo(cx - 60, cy + 100, cx - 85, cy + 45);
      ctx.stroke();

      // Tallo derecho
      ctx.beginPath();
      ctx.moveTo(cx, height);
      ctx.quadraticCurveTo(cx + 60, cy + 100, cx + 85, cy + 45);
      ctx.stroke();
      ctx.restore();

      // Flores (estilo redondo suave)
      drawSoftFlower(cx, cy - 10, 52);        // central (más grande)
      drawSoftFlower(cx - 85, cy + 45, 38);   // izquierda
      drawSoftFlower(cx + 85, cy + 45, 38);   // derecha

      requestAnimationFrame(render);
    }

    function toggleAudio() {
      const song = document.getElementById('bg-song');
      const btn = document.querySelector('.btn-audio');

      if (song.paused) {
        song.play().catch(() => {});
        btn.innerText = "⏸️ Pausar Sonido";
      } else {
        song.pause();
        btn.innerText = "♪ Activar Sonido";
      }
    }

    render();
  </script>
</body>
</html>
