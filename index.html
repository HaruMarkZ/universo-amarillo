<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universo de Flores Amarillas | Madait 🌌</title>
    <!-- Vinculamos el CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Contenedor del Espacio Profundo -->
    <div class="space-container">
        <!-- Nebulosas generadas por CSS -->
        <div class="nebula purple-nebula"></div>
        <div class="nebula gold-nebula"></div>
        
        <!-- Capa de Estrellas -->
        <div id="stars-layer"></div>
    </div>

    <!-- Interfaz de Usuario e Interacción -->
    <div class="interface-wrapper">
        <h1 class="cosmic-title">MADAIT</h1>
        <p class="cosmic-subtitle">Giras en el centro de mi universo entero ✨</p>
        
        <!-- Lienzo interactivo donde se procesan las flores y partículas -->
        <canvas id="galaxy-canvas"></canvas>

        <div class="music-controller">
            <!-- AQUÍ PUEDES REEMPLAZAR 'tu-cancion.mp3' POR EL LINK DE TU MÚSICA LUEGO -->
            <audio id="bg-song" loop src="tu-cancion.mp3"></audio>
            <button class="btn-audio" onclick="toggleAudio()">🎵 Activar Música</button>
        </div>
    </div>

    <!-- Vinculamos la lógica de JS al final -->
    <script src="main.js"></script>
</body>
</html>
